# Тег vX.Y.Z → тесты на macOS и Windows → сборка dmg (arm64 + x64) и установщика Windows → релиз на GitHub.
# Приложение у пользователей само находит этот релиз и обновляется.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --draft --title "Вычитка ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md
  build:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --no-audit --no-fund
      - name: Тесты движка и модулей
        run: npm test
      - name: Сквозной тест интерфейса
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'e2e-${{ matrix.os }}', path: test/e2e/out/ }
      - name: Сборка и публикация (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --mac --publish always
      - name: Проверка собранного приложения (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: node test/e2e/packaged.js release/mac-arm64/Vychitka.app/Contents/MacOS/Vychitka
      - name: Сборка и публикация (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: npx electron-builder --win --publish always
      - name: Проверка собранного приложения (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: node test/e2e/packaged.js release/win-unpacked/Vychitka.exe
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
